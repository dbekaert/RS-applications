[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rs-tools"
version = "0.1.0"
description = "Remote-sensing archive access and visualization toolkit."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "xarray>=2023.1",
    "matplotlib>=3.7",
    "cartopy>=0.21",
    "pystac-client>=0.7",
    "requests>=2.28",
]

[project.optional-dependencies]
notebook = [
    "jupyter>=1.0",
    "ipywidgets>=8.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require network access to live STAC APIs",
]

[tool.setuptools.packages.find]
include = ["rs_tools*"]
