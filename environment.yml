# create environment : mamba env create -f environment.yml
# update environment : mamba env update -f environment.yml --prune
# remove environment : conda env remove -n RS-applications
# enter  environment : conda activate RS-applications
# exit   environment : conda deactivate

name: RS-applications
channels:
  - conda-forge
dependencies:
  - python>=3.9
  - cartopy>=0.21
  - dask
  - gdal>=3.7
  - matplotlib>=3.7
  - numpy>=1.24
  - pip
  - pystac-client>=0.7
  - pytest>=7.0
  - pytest-cov>=4.0
  - rasterio
  - requests>=2.28
  - rioxarray
  - xarray>=2023.1
  # Notebook support (optional)
  - jupyter
  - ipywidgets>=8.0
  - pip:
    - asf_search>=7.0
